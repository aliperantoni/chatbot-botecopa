<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoteCopa – Especialista em Copas do Mundo</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div class="chat-card">
        <!-- HEADER -->
        <div class="chat-header">
            <i class="fas fa-futbol"></i>
            <h1>BoteCopa</h1>
            <span class="sub"><i class="fas fa-trophy"></i> 2026</span>
        </div>

        <!-- MENSAGENS -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- FOOTER -->
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="Pergunte sobre Copas do Mundo..." />
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
